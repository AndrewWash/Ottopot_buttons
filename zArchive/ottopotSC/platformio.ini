; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy36]
platform = teensy
board = teensy40
framework = arduino
build_flags = -DUSB_MIDI
; USB_MIDI_SERIAL helps for debugging via pio device monitor
;build_flags = -DUSB_MIDI_SERIAL

; Uncomment this to use tycmd for uploading — this is the only method I've found to 
; flash on Linux without pressing the reset button on the Teensy.
; https://github.com/Koromix/tytools
upload_command = tycmd upload $SOURCE

; Use this if you have multiple Teensys - select the one you want to flash by changing the -B flag (via tycmd list)
;upload_command = tycmd upload -B 14513090-Teensy $SOURCE

lib_deps = 
	stechio/Analog-Digital Multiplexers
